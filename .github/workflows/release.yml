name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release

      - name: Package app bundle
        run: |
          APP_NAME=MacFanControl
          VERSION="${GITHUB_REF_NAME#v}"
          APP_DIR="$APP_NAME.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp .build/release/MacFanControl "$APP_DIR/Contents/MacOS/$APP_NAME"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string MacFanControl" "$APP_DIR/Contents/Info.plist" 2>/dev/null || \
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleExecutable</key><string>MacFanControl</string>' \
            '<key>CFBundleIdentifier</key><string>com.macfancontrol.app</string>' \
            '<key>CFBundleName</key><string>MacFanControl</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            "<key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
            '<key>CFBundleVersion</key><string>1</string>' \
            '<key>LSMinimumSystemVersion</key><string>13.0</string>' \
            '<key>LSUIElement</key><true/>' \
            '</dict></plist>' > "$APP_DIR/Contents/Info.plist"
          ./scripts/build-dmg.sh "$APP_DIR"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacFanControl.dmg
            MacFanControl.app/**/*
